<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Adivina el Número Secreto</title>
  <!-- Vinculamos el archivo de estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🎯 Adivina el número secreto</h1>
    
    <!-- Input donde el usuario ingresa el número -->
    <input type="text" id="inputNumero" placeholder="Ingresa un número del 1 al 100">

    <!-- Botón para enviar el intento -->
    <button id="btnAdivinar">Adivinar</button>

    <!-- Aquí mostramos los mensajes de acierto/error -->
    <p id="mensaje"></p>

    <!-- Aquí mostramos el historial de intentos -->
    <div id="historial"></div>
  </div>

  <!-- Vinculamos el archivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
